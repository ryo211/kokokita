AWSTemplateFormatVersion: "2010-09-09"
Description: >
  course-stats-batch: Supabaseの集計RPC（compute_course_stats）を呼び、
  stats.jsonをS3へ書き出してCloudFrontのキャッシュを無効化するLambda。
  EventBridgeで1日1回起動する（doc/server-feature-design.md フェーズ1「表示」参照）。

Parameters:
  SupabaseUrl:
    Type: String
    Description: 例 https://xxxx.supabase.co
  SupabaseAnonKey:
    Type: String
    NoEcho: true
    Description: 公開可能なanon/publishableキー。service_roleキーは絶対に指定しないこと
  TargetBucket:
    Type: String
    Description: stats.jsonを書き出す先のS3バケット（既存のコース配信バケット）
  TargetKey:
    Type: String
    Default: course/store/stats.json
  CloudFrontDistributionId:
    Type: String
    Default: ""
    Description: 空文字の場合はキャッシュ無効化を行わない
  MinDisplayCount:
    Type: Number
    Default: 10
  ScheduleExpression:
    Type: String
    Default: "cron(0 3 * * ? *)"
    Description: 毎日03:00 UTC（日本時間12:00）に実行
  ArtifactBucket:
    Type: String
    Description: Lambdaコードのzipを置くS3バケット（deploy.shがアップロードする）
  ArtifactKey:
    Type: String
    Description: deploy.shが算出するzipのキー（コード内容のハッシュを含む）

Conditions:
  HasCloudFrontDistribution: !Not [!Equals [!Ref CloudFrontDistributionId, ""]]

Resources:
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: course-stats-batch-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: course-stats-batch-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${TargetBucket}/${TargetKey}"
              - !If
                - HasCloudFrontDistribution
                - Effect: Allow
                  Action: cloudfront:CreateInvalidation
                  Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}"
                - !Ref AWS::NoValue

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: course-stats-batch
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt ExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_ANON_KEY: !Ref SupabaseAnonKey
          S3_BUCKET: !Ref TargetBucket
          S3_KEY: !Ref TargetKey
          CLOUDFRONT_DISTRIBUTION_ID: !Ref CloudFrontDistributionId
          MIN_DISPLAY_COUNT: !Ref MinDisplayCount

  ScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: course-stats-batch-daily
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Id: course-stats-batch-target
          Arn: !GetAtt Function.Arn

  SchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduleRule.Arn

Outputs:
  FunctionArn:
    Value: !GetAtt Function.Arn
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn

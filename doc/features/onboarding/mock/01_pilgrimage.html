body{margin:0}
a{color:#4B4FD1}a:hover{color:#3A3DB0}
@keyframes kk-stamp{
  0%{opacity:0;transform:scale(2.3) rotate(-24deg)}
  14%{opacity:0;transform:scale(2.3) rotate(-24deg)}
  26%{opacity:1;transform:scale(0.88) rotate(-10deg)}
  31%{transform:scale(1.06) rotate(-10deg)}
  36%{transform:scale(1) rotate(-10deg)}
  88%{opacity:1;transform:scale(1) rotate(-10deg)}
  100%{opacity:0;transform:scale(1) rotate(-10deg)}
}
@keyframes kk-bump{
  0%,25%{transform:translateY(0)}
  27%{transform:translateY(3px)}
  31%,100%{transform:translateY(0)}
}
@keyframes kk-ink{
  0%,25%{opacity:0;transform:scale(0.6)}
  27%{opacity:0.35;transform:scale(0.9)}
  45%,100%{opacity:0;transform:scale(1.5)}
}
@keyframes kk-seal{
  0%,30%{transform:scale(0.6);opacity:0}
  40%{transform:scale(1.12);opacity:1}
  46%,92%{transform:scale(1);opacity:1}
  100%{transform:scale(1);opacity:0}
}
.kk-stamp{animation:kk-stamp 3.4s cubic-bezier(.2,.8,.3,1) infinite}
.kk-card{animation:kk-bump 3.4s ease-out infinite}
.kk-ink{animation:kk-ink 3.4s ease-out infinite}
.kk-seal{animation:kk-seal 3.4s ease-out infinite}
@media (prefers-reduced-motion: reduce){.kk-stamp,.kk-card,.kk-ink,.kk-seal{animation:none}}

body{margin:0}
a{color:#4B4FD1}a:hover{color:#3A3DB0}
@keyframes kk-drop{
  0%{opacity:0;transform:translateY(-40px)}
  10%{opacity:0;transform:translateY(-40px)}
  24%{opacity:1;transform:translateY(4px)}
  30%{transform:translateY(-3px)}
  35%,90%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(0)}
}
@keyframes kk-ripple{
  0%,24%{opacity:0;transform:scale(0.5)}
  26%{opacity:0.5;transform:scale(0.6)}
  60%,100%{opacity:0;transform:scale(1.6)}
}
@keyframes kk-ripple2{
  0%,32%{opacity:0;transform:scale(0.5)}
  34%{opacity:0.35;transform:scale(0.6)}
  70%,100%{opacity:0;transform:scale(1.6)}
}
@keyframes kk-rise{
  0%,34%{opacity:0;transform:translateY(8px)}
  44%,90%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(0)}
}
.kk-drop{animation:kk-drop 3.6s cubic-bezier(.2,.8,.3,1) infinite}
.kk-ripple{animation:kk-ripple 3.6s ease-out infinite}
.kk-ripple2{animation:kk-ripple2 3.6s ease-out infinite}
.kk-rise{animation:kk-rise 3.6s ease-out infinite}
@media (prefers-reduced-motion: reduce){.kk-drop,.kk-ripple,.kk-ripple2,.kk-rise{animation:none}}
